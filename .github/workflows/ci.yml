name: CI

on:
  push:
    branches: [main, dev-2.x]
  pull_request:
    branches: [main, dev-2.x]

permissions:
  contents: read

jobs:
  ci:
    name: Build / Lint / Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit (fail on high+ severity)
        # Production dependencies must be free of high / critical vulnerabilities.
        # Lower-severity / dev-only issues are still surfaced as warnings in PRs
        # via Dependabot rather than blocking CI.
        run: npm audit --omit=dev --audit-level=high
